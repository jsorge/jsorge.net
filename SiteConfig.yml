title: jsorge.net
description: Christian, husband, dad, developer, batman aficionado
url: https://jsorge.net
metaDescription: By Jared Sorge.
batchSize: 5
ssl:
  contactEmail: jared@jsorge.net
feedSize: 20
sitesToPing:
  - https://micro.blog/ping?url=https%3A%2F%2Fjsorge.net%2Ffeed.json
maverickVersion: 5.0.1
disablePageCaching: true
broadcasting:
  enabled: false
  autoPublishAfter: 2026-09-01T00:00:00Z
  admin:
    usernameSecret: maverick-admin-username
    passwordSecret: maverick-admin-password
  state:
    type: r2
    encryptionKeySecret: maverick-state-encryption-key
    r2:
      bucket: maverick-state
      keyPrefix: jsorge.net
      accountIDSecret: cloudflare-r2-account-id
      accessKeyIDSecret: cloudflare-r2-access-key-id
      secretAccessKeySecret: cloudflare-r2-secret-access-key
  providers:
    - id: bluesky
      type: bluesky
      account: jsorge.bsky.social
      credentialSecret: bluesky-app-password
      linkPreview: true
      postTemplate: |-
        New blog post: {{title}}

        {{description}}

        {{url}}
    - id: mastodon
      type: mastodon
      instanceURL: https://mastodon.social
      accessTokenSecret: mastodon-access-token
      visibility: public
      postTemplate: |-
        New blog post: {{title}}

        {{description}}

        {{url}}
    - id: linkedin
      type: linkedin
      clientIDSecret: linkedin-client-id
      clientSecretSecret: linkedin-client-secret
      linkedinVersion: "202604"
      visibility: public
      postTemplate: |-
        New blog post: {{title}}

        {{description}}

        Read more: {{url}}
