[tools]
doctl = "latest"
"1password-cli" = "latest"
gh = "latest"

[env]
MAVERICK_REGISTRY = "ghcr.io/taphouseio/maverick"

[tasks.serve]
description = "Start the site (Cloudflare handles SSL)"
run = "./.tools/spin_up.sh"

[tasks.down]
description = "Stop Docker containers"
run = "docker compose -f ./.tools/docker compose.yml down"

[tasks.docker-logs]
description = "View Maverick container logs"
run = "docker compose -f ./.tools/docker compose.yml logs maverick"

[tasks.build-css]
description = "Rebuild Tailwind CSS"
run = """
npx tailwindcss \
  -i ./styles/styles.source.css \
  -c ./tailwind.config.js \
  -o ./Public/styles/styles.css \
  --minify
"""

[tasks.ensure-swift-sh]
description = "Ensure swift-sh is installed"
run = "./tools/ensure-swift-sh.sh"
hide = true

[tasks.newpost]
description = "Create a new blog post"
depends = ["ensure-swift-sh"]
run = "./vendor/swift-sh ./tools/NewBlogPost.swift"

[tasks.publish]
description = "Commit, push, and deploy to production"
depends = ["ensure-swift-sh"]
run = "./vendor/swift-sh ./tools/PublishWorkingCopy.swift"

[tasks.resize-images]
description = "Optimize images in committed textbundles"
run = "bash mise/scripts/resize-images.sh"

[tasks.new-server]
description = "Create and configure a new Digital Ocean droplet"
run = "bash mise/scripts/new-server.sh"

[tasks.update-ssh-host]
description = "Update GitHub SSH_HOST secret with new server IP"
run = "bash mise/scripts/update-ssh-host.sh"
