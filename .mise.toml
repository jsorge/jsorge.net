[tools]
doctl = "latest"
"1password-cli" = "latest"
gh = "latest"

[env]
MAVERICK_REGISTRY = "ghcr.io/taphouseio/maverick"

[tasks.serve]
description = "Start the site (Cloudflare handles SSL)"
run = "./.tools/spin_up.sh"

[tasks.down]
description = "Stop Docker containers"
run = "docker compose -f ./.tools/docker-compose.yml down"

[tasks.docker-logs]
description = "View Maverick container logs"
run = "docker compose -f ./.tools/docker-compose.yml logs maverick"

[tasks.docker-errors]
description = "Show recent Swift fatal errors from Maverick"
run = "docker compose -f ./.tools/docker-compose.yml logs maverick 2>&1 | grep -B 5 'Fatal error' | tail -100"

[tasks.build-css]
description = "Rebuild Tailwind CSS"
run = """
npx tailwindcss \
  -i ./styles/styles.source.css \
  -c ./tailwind.config.js \
  -o ./Public/styles/styles.css \
  --minify
"""

[tasks.preview]
description = "Preview the site locally at http://localhost:8080 (uses Apple's container tool)"
run = "bash mise/scripts/preview.sh"

[tasks.preview-down]
description = "Stop the local preview container"
run = "container delete --force maverick-preview"

[tasks.preview-logs]
description = "View local preview container logs"
run = "container logs maverick-preview"

[tasks.prepare-post]
description = "Add Maverick metadata to newest textbundle"
run = "bash mise/scripts/prepare-post.sh"

[tasks.publish-draft]
description = "Publish a draft textbundle and commit it"
run = "bash mise/scripts/publish-draft.sh"

[tasks.resize-images]
description = "Optimize images in committed textbundles"
run = "bash mise/scripts/resize-images.sh"

[tasks.new-server]
description = "Create and configure a new Digital Ocean droplet"
run = "bash mise/scripts/new-server.sh"

[tasks.update-ssh-host]
description = "Update GitHub SSH_HOST secret with new server IP"
run = "bash mise/scripts/update-ssh-host.sh"
